<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nueva contraseña · BaeBae</title>
<style>
:root { --bg:#F7F3FB; --card:#FFFFFF; --ink:#1D1430; --muted:#5E5470; --line:#DDD2EC; --accent:#7C3AED; --rose:#C0267A; }
@media (prefers-color-scheme: dark) { :root { --bg:#0B0816; --card:#120E21; --ink:#F3EEFF; --muted:#B4A9CC; --line:#2A2240; --accent:#C084FC; --rose:#F472B6; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
main { max-width:760px; margin:0 auto; padding:32px 20px 64px; display:grid; gap:18px; }
.marca { font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:13px; color:var(--accent); }
h1 { margin:0; font-size:30px; line-height:1.2; letter-spacing:-.02em; }
h2 { margin:0 0 6px; font-size:18px; }
p { margin:0 0 8px; color:var(--muted); }
section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
.lead { color:var(--ink); font-size:17px; }
nav a { color:var(--accent); margin-right:14px; font-weight:600; }
label { display:block; font-weight:700; margin-bottom:6px; }
input { width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
button { margin-top:12px; width:100%; min-height:48px; border:0; border-radius:999px; background:var(--accent); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
.aviso { padding:12px 14px; border-radius:12px; background:var(--line); color:var(--ink); }
</style>
</head>
<body>
<main>
<div class="marca">BaeBae</div>
<h1>Crea una contraseña nueva</h1>
<section>
<p id="estado">Comprobando el enlace…</p>
<form id="forma" hidden>
<label for="clave">Contraseña nueva (al menos 6 caracteres) · New password</label>
<input id="clave" type="password" minlength="6" autocomplete="new-password" required>
<button type="submit">Guardar · Save</button>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var estado = document.getElementById('estado');
  var forma = document.getElementById('forma');
  var sb = window.supabase.createClient("https://yfyascscozdbrxcbhbjk.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmeWFzY3Njb3pkYnJ4Y2JoYmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzY0MzksImV4cCI6MjEwNDE1MjQzOX0.TbVhpGYmxuR4iZlIat5kgKEalXbiUP_LYpQ-hFD1EzE", { auth: { detectSessionInUrl: true, persistSession: false } });
  function listo() { estado.textContent = 'Escribe tu contraseña nueva. · Type your new password.'; forma.hidden = false; }
  sb.auth.onAuthStateChange(function (evento) { if (evento === 'PASSWORD_RECOVERY' || evento === 'SIGNED_IN') listo(); });
  setTimeout(function () { sb.auth.getSession().then(function (r) { if (r.data && r.data.session) listo(); else if (forma.hidden) estado.textContent = 'El enlace caducó o ya se usó. Pide otro desde la app («Olvidé mi contraseña»). · This link expired; request a new one from the app.'; }); }, 1500);
  forma.addEventListener('submit', function (e) {
    e.preventDefault();
    var clave = document.getElementById('clave').value;
    if (clave.length < 6) { estado.textContent = 'Necesita al menos 6 caracteres. · At least 6 characters.'; return; }
    sb.auth.updateUser({ password: clave }).then(function (r) {
      if (r.error) { estado.textContent = 'No se pudo guardar: ' + r.error.message; return; }
      forma.hidden = true;
      estado.textContent = '¡Listo! Vuelve a la app y entra con tu contraseña nueva. · Done! Go back to the app and sign in.';
    });
  });
})();
</script>
</body>
</html>
